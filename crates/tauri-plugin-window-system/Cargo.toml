[package]
name = "tauri-plugin-window-system"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-window-system"
license = "MIT OR Apache-2.0"
description = "Tauri plugin for multi-window registry, lifecycle, and routing."
repository = "https://github.com/YU000jp/tauri-window-system"
homepage = "https://github.com/YU000jp/tauri-window-system"
documentation = "https://docs.rs/tauri-plugin-window-system"
readme = "README.md"
keywords = ["tauri", "plugin", "window", "multi-window"]
categories = ["api-bindings", "gui"]

[lib]
name = "tauri_plugin_window_system"
crate-type = ["cdylib", "rlib"]

[features]
default = []
window-timings = ["dep:tracing"]

[dependencies]
dpi = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2" }
tracing = { version = "0.1", optional = true }

[build-dependencies]
tauri-utils = { version = "2" }
