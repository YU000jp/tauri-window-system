name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version in SemVer form (for example, 0.1.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # pnpm caching in setup-node expects pnpm to already be available on PATH.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure git identity
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Validate release version
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          $semverPattern = '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?(?:\+([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$'

          if ($version -notmatch $semverPattern) {
            throw "Release version must follow SemVer 2.0.0, for example 0.1.0"
          }

          $packageJsons = @(
            "packages/tauri-plugin-window-system-api/package.json",
            "packages/tauri-window-ui/package.json"
          )

          foreach ($path in $packageJsons) {
            $pkg = Get-Content $path -Raw | ConvertFrom-Json
            if ($pkg.version -ne $version) {
              throw "Package version mismatch in ${path}: expected $version, found $($pkg.version)"
            }
          }

          # Read the crate version from cargo metadata instead of parsing Cargo.toml in PowerShell.
          $cargoMetadata = cargo metadata --no-deps --format-version 1 --manifest-path "crates/tauri-plugin-window-system/Cargo.toml" | ConvertFrom-Json
          $cratePackage = $cargoMetadata.packages | Where-Object { $_.name -eq "tauri-plugin-window-system" } | Select-Object -First 1

          if (-not $cratePackage) {
            throw "Could not read crate version from cargo metadata for crates/tauri-plugin-window-system/Cargo.toml"
          }

          if ($cratePackage.version -ne $version) {
            throw "Crate version mismatch in crates/tauri-plugin-window-system/Cargo.toml: expected $version, found $($cratePackage.version)"
          }

      - name: Typecheck workspace
        run: pnpm -r typecheck

      - name: Build workspace
        run: pnpm -r build

      - name: Test Rust plugin
        run: cargo test -p tauri-plugin-window-system

      - name: Check example host
        run: cargo check -p solid-host

      - name: Inspect Rust package contents
        run: cargo package --allow-dirty --list -p tauri-plugin-window-system

      - name: Pack npm API package
        working-directory: packages/tauri-plugin-window-system-api
        run: npm pack --dry-run --json

      - name: Pack npm UI package
        working-directory: packages/tauri-window-ui
        run: npm pack --dry-run --json

      - name: Publish Rust crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p tauri-plugin-window-system --locked

      - name: Publish npm API package
        working-directory: packages/tauri-plugin-window-system-api
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Publish npm UI package
        working-directory: packages/tauri-window-ui
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Create release tag
        shell: pwsh
        run: |
          $tag = "v${{ inputs.version }}"
          git tag -a $tag -m "Release $tag"
          git push origin $tag

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          generate_release_notes: true
